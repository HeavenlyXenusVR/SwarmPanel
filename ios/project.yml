name: SwarmPanel

options:
  bundleIdPrefix: com.swarmpanel
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_SWIFT_FLAGS: "-D DEBUG"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: "YES"

targets:
  SwarmPanel:
    type: application
    platform: iOS
    sources:
      - path: SwarmPanel/Sources
    # Resources listed EXPLICITLY so XcodeGen creates a proper "Compile Asset
    # Catalogs" (actool) build phase — mirrors Lumisound's project.yml.
    resources:
      - path: SwarmPanel/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.ios
        INFOPLIST_FILE: SwarmPanel/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPS_IN_ASSET_CATALOG_COMPILATION: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      buildAction:
        targets:
          - SwarmPanel
      runAction:
        config: Debug
      testAction:
        config: Debug
      profileAction:
        config: Release
      archiveAction:
        config: Release
      analyzeAction:
        config: Debug
      testTargets:
        - SwarmPanelTests

  SwarmPanelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwarmPanelTests
    dependencies:
      - target: SwarmPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swarmpanel.ios.tests
        INFOPLIST_FILE: ""
